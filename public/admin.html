<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Eagle Event</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Previne erro 404 de favicon -->
    <link rel="icon" href="data:,">
    <style>
        /* Estilos específicos para a tabela do admin */
        .admin-container { padding-top: 100px; min-height: 80vh; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #112240; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #233554; color: #ccd6f6; vertical-align: top; }
        th { background-color: #0a192f; color: #64ffda; font-family: 'Orbitron', sans-serif; }
        tr:hover { background-color: #1d2d50; }
        .back-link { color: #64ffda; text-decoration: none; font-weight: bold; }
        td ul { list-style: none; padding: 0; margin: 0; }
        td li { margin-bottom: 5px; }

        /* Estilos do Modal de Login */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 12, 27, 0.95); /* Fundo escuro quase opaco */
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .login-box {
            background: #112240; padding: 40px; border-radius: 10px;
            border: 1px solid #64ffda; box-shadow: 0 0 20px rgba(100, 255, 218, 0.2);
            text-align: center; width: 90%; max-width: 400px;
        }
        .login-box h2 { color: #ccd6f6; margin-bottom: 20px; font-family: 'Orbitron', sans-serif; }
        .login-input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            background: #0a192f; border: 1px solid #233554; color: #fff;
            border-radius: 4px; font-size: 1rem;
        }
        .login-btn {
            width: 100%; padding: 12px; background: #64ffda; color: #0a192f;
            border: none; font-weight: bold; cursor: pointer; border-radius: 4px;
            font-size: 1rem; transition: 0.3s;
        }
        .login-btn:hover { background: #00bfa5; }
        .error-msg { color: #ff6b6b; margin-top: 10px; display: none; font-size: 0.9rem; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo">EAGLE <span style="font-size: 0.5em; color: #64ffda;">ADMIN</span></div>
        </div>
    </nav>

    <!-- Modal de Login (Aparece ao entrar) -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>Acesso Restrito</h2>
            <input type="text" id="adminUser" class="login-input" placeholder="Usuário" autocomplete="off">
            <input type="password" id="adminPass" class="login-input" placeholder="Senha">
            <button id="btnLogin" class="login-btn">Entrar</button>
            <p id="loginError" class="error-msg">Credenciais inválidas!</p>
        </div>
    </div>

    <div class="container admin-container">
        <div style="margin-bottom: 3rem;">
        <button onclick="showSection('teams')" class="btn-nav" id="teamsTab" style="background: linear-gradient(135deg, #64ffda, #00bfa5); color: #0a192f; padding: 0.75rem 1.5rem; margin-right: 1rem; border-radius: 25px; font-weight: 600;">🏆 Times</button>
        <button onclick="showSection('minicursos')" class="btn-nav" id="minicursosTab" style="background: linear-gradient(135deg, #8b5cf6, #007bff); color: white; padding: 0.75rem 1.5rem; border-radius: 25px; font-weight: 600;">📚 Minicursos</button>
        </div>

        <!-- Teams Section -->
        <div id="teamsSection">
            <h2 class="section-title">🏆 Times Inscritos</h2>
            <div style="overflow-x:auto;">
                <table id="teamsTable">
                    <thead>
                        <tr>
                            <th>Nome do Time</th>
                            <th>Integrantes</th>
                            <th>Data Inscrição</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Minicursos Section -->
        <div id="minicursosSection" style="display: none;">
            <h2 class="section-title">📚 Minicursos & Inscrições</h2>
            <div id="adminMinicursosList"></div>
        </div>
    </div>

    <style>
        .admin-minicurso { margin-bottom: 1.5rem; background: rgba(17,34,64,0.8); padding: 1.25rem; border-radius: 16px; border-left: 4px solid #8b5cf6; display: flex; flex-direction: column; gap: 1rem; }
        .admin-minicurso h4 { color: #8b5cf6; margin: 0 0 0.5rem 0; font-size: 1.1rem; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: #8892b0; }
        .admin-inscrito { background: rgba(10,25,47,0.7); padding: 0.75rem; margin-bottom: 0.4rem; border-radius: 10px; font-size: 0.88rem; display: flex; justify-content: space-between; align-items: center; }
        .admin-inscrito strong { color: #64ffda; }
        .admin-empty { color: #8892b0; font-style: italic; text-align: center; padding: 2rem; }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const overlay = document.getElementById('loginOverlay');
            const btnLogin = document.getElementById('btnLogin');
            const errorMsg = document.getElementById('loginError');

            // Função para tentar carregar os dados
            async function loadData(user, pass) {
                // Cria o header de autenticação Basic Auth manualmente
                const headers = {};
                if (user && pass) {
                    headers['Authorization'] = 'Basic ' + btoa(user + ":" + pass);
                }

                try {
                    const response = await fetch('/api/participants', { headers });
                    
                    if (response.ok) {
                        const result = await response.json();
                        renderTable(result.data);
                        overlay.classList.add('hidden'); // Esconde o login se deu certo
                        return true;
                    } else {
                        return false;
                    }
                } catch (e) {
                    console.error(e);
                    return false;
                }
            }

            // Evento do botão de login
            btnLogin.addEventListener('click', async () => {
                const u = document.getElementById('adminUser').value;
                const p = document.getElementById('adminPass').value;
                btnLogin.textContent = 'Verificando...';
                
                const success = await loadData(u, p);
                
                if (success) {
                    loadAdminMinicursos(u, p); // Carrega minicursos após login
                } else {
                    errorMsg.style.display = 'block';
                    btnLogin.textContent = 'Entrar';
                }
            });

            // Função para renderizar a tabela (separada para organizar)
            function renderTable(data) {
                const tbody = document.querySelector('#teamsTable tbody');
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center">Nenhuma equipe inscrita ainda.</td></tr>';
                    return;
                }

                tbody.innerHTML = ''; // Limpa antes de preencher
                data.forEach(team => {
                    const members = team.members; // O campo members vem como JSON do banco
                    
                    // Cria lista HTML de todos os membros
                    let membersHtml = '<ul>';
                    members.forEach((m, index) => {
                        const role = index === 0 ? '<span style="color: #64ffda; font-weight: bold;">(Líder)</span>' : '';
                        membersHtml += `<li>• <strong>${m.name}</strong> ${role}<br><small style="opacity: 0.7;">Mat: ${m.matricula} | Semestre: ${m.semestre} | ${m.email} | Tel: ${m.phone || 'N/A'}</small></li>`;
                    });
                    membersHtml += '</ul>';

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="font-weight:bold; color:#64ffda">${team.team_name}</td>
                        <td>${membersHtml}</td>
                        <td>${new Date(team.created_at).toLocaleDateString('pt-BR')}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // Admin Minicursos
            async function loadAdminMinicursos(user, pass) {
                const headers = { 'Authorization': 'Basic ' + btoa(user + ':' + pass) };
                try {
                    const res = await fetch('/api/admin/minicursos', { headers });
                    if (res.ok) {
                        const result = await res.json();
                        renderAdminMinicursos(result.data);
                    }
                } catch (e) {
                    console.error('Erro admin minicursos:', e);
                }
            }

            function renderAdminMinicursos(data) {
                const container = document.getElementById('adminMinicursosList');
                container.innerHTML = '';
                data.forEach(mc => {
                    const div = document.createElement('div');
                    div.className = 'admin-minicurso';
                    div.innerHTML = `
                        <div class="admin-header">
                            <h4>${mc.nome}</h4>
                            <span>(${mc.total_inscritos}/${mc.vagas_maximas})</span>
                        </div>
                        <div style="font-size: 0.9rem; color: #a0b2c5; margin-bottom: 1rem;">
                            <strong>👤 ${mc.ministrante}</strong> | 📅 ${mc.data} ${mc.horario} | 📍 ${mc.local || 'TBA'}
                        </div>
                        ${mc.inscricoes.length > 0 ? mc.inscricoes.map(insc => `
                            <div class="admin-inscrito">
                                <div>
                                    <strong>${insc.nome}</strong><br>
                                    <small>${insc.curso} - ${insc.semestre}</small>
                                </div>
                                <small>${new Date(insc.created_at).toLocaleDateString('pt-BR')} ${new Date(insc.created_at).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}</small>
                            </div>
                        `).join('') : '<div class="admin-empty">Nenhuma inscrição ainda.</div>'}
                    `;
                    container.appendChild(div);
                });
            }

            // Tabs
            window.showSection = function(section) {
                document.getElementById('teamsSection').style.display = section === 'teams' ? 'block' : 'none';
                document.getElementById('minicursosSection').style.display = section === 'minicursos' ? 'block' : 'none';
                document.getElementById('teamsTab').style.opacity = section === 'teams' ? '1' : '0.5';
                document.getElementById('minicursosTab').style.opacity = section === 'minicursos' ? '1' : '0.5';
            };
        });
    </script>
</body>
</html>
