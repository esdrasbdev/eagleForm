<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minicursos | Eagle Event</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&amp;family=Roboto:wght@300;400;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        /* Minicursos cards - Compact & Beautiful */
        .minicursos-hero { background: linear-gradient(135deg, #0a192f 0%, #1a237e 100%); min-height: 60vh; }
        .minicursos-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 1rem; 
            margin: 1.5rem 0; 
        }
@media (max-width: 768px) {
            .minicursos-grid { grid-template-columns: 1fr; gap: 1rem; margin: 1.5rem 0; }
            .minicurso-card { min-height: 510px; height: auto; max-height: 570px; margin: 0; }
            .card-header { padding: 0.75rem 0.75rem 0.55rem; }
            .card-title { font-size: 0.92rem; line-height: 1.18; }
            .card-details { padding: 0.65rem 0.75rem 0.16rem !important; min-height: 240px; }
            .card-meta { flex-wrap: wrap; gap: 0.22rem; font-size: 0.71rem; align-items: center; }
            .card-meta .highlight { font-size: 0.76rem; padding: 0.14rem 0.3rem; min-width: fit-content; }
            .vagas-info { padding: 0.4rem 0.4rem 0.3rem; }
            .btn-container { padding-bottom: 0.55rem !important; margin-top: auto !important; }
            .btn-inscrever { padding: 0.65rem 0.75rem; font-size: 0.81rem; flex-shrink: 0; }
            .card-descricao { font-size: 0.7rem; -webkit-line-clamp: 8; margin-bottom: 0.16rem; }
        }
@media (max-width: 480px) {
            .minicurso-card { min-height: 490px; height: auto; max-height: 550px; }
            .card-title { font-size: 0.88rem; }
            .card-details { padding: 0.55rem 0.65rem 0.14rem !important; }
            .card-meta { font-size: 0.68rem; gap: 0.2rem; }
            .card-meta .highlight { font-size: 0.72rem; padding: 0.12rem 0.26rem; }
            .card-descricao { -webkit-line-clamp: 7; font-size: 0.68rem; }
            .btn-inscrever { padding: 0.6rem 0.65rem; font-size: 0.78rem; }
        }
        .minicurso-card { background: rgba(10,25,47,0.95); border: 1px solid rgba(139,92,246,0.15); border-radius: 16px; overflow: hidden; transition: all 0.3s ease; min-height: 450px; height: auto; max-height: 510px; display: flex; flex-direction: column; box-sizing: border-box; }
        @media (max-width: 1024px) {
            .minicurso-card { min-height: 460px; max-height: 520px; }
        }
        .minicurso-card:hover { transform: translateY(-8px); border-color: #8b5cf6; box-shadow: 0 25px 50px rgba(139,92,246,0.25); }
        .card-header { background: linear-gradient(135deg, #8b5cf6, #007bff); padding: 1rem 1rem 0.75rem; }
        .card-title { color: white; font-family: 'Orbitron', sans-serif; margin: 0 0 0.25rem 0; font-size: 1.1rem; line-height: 1.3; }
        .card-ministrante { color: rgba(255,255,255,0.92); font-size: 0.88rem; display: flex; align-items: center; gap: 0.4rem; }
        .card-details { padding: 0.875rem 1rem 0.375rem 1rem; display: flex; flex-direction: column; flex: 1; gap: 0.4rem; }
        .btn-container { margin-top: auto; padding-bottom: 1rem; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; font-size: 0.84rem; color: #a0b2c5; gap: 0.5rem; }
        .card-meta .highlight { font-weight: 700; font-size: 0.92rem; padding: 0.25rem 0.6rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); display: inline-flex; align-items: center; gap: 0.3rem; margin: 0.1rem; }
        .data-highlight { background: rgba(100,255,218,0.2); color: #64ffda; }
        .horario-highlight { background: rgba(100,255,218,0.2); color: #64ffda; }
        .local-highlight { background: rgba(100,255,218,0.2); color: #64ffda; }
        .card-meta span { display: flex; align-items: center; gap: 0.3rem; }
        .vagas-info { font-weight: 600; color: #64ffda; font-size: 0.9rem; background: rgba(100,255,218,0.08); border-radius: 10px; padding: 0.75rem 0.75rem 0.5rem; border-left: 3px solid #64ffda; }
        .full { color: #ff6b6b !important; border-left-color: #ff6b6b; background: rgba(255,107,107,0.08) !important; }
        .vagas-count { font-size: 0.95rem; margin-bottom: 0.25rem; }
        .vagas-progress { height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; margin: 0.4rem 0; }
        .vagas-progress-fill { height: 100%; background: linear-gradient(90deg, #64ffda, #00d4aa); border-radius: 3px; transition: width 0.4s ease; box-shadow: 0 0 10px #64ffda; }
        .vagas-remaining { font-size: 0.85rem; opacity: 0.9; }
        .card-descricao { font-size: 0.74rem; line-height: 1.32; color: #b0c4de; margin: 0.4rem 0 0.25rem 0; display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
        .card-material { font-size: 0.78rem; color: #8b5cf6; opacity: 0.9; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.3rem; }
        .btn-inscrever { width: 100%; padding: 0.9rem 1.2rem; background: linear-gradient(135deg, #8b5cf6, #007bff); color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 0.92rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 0.4rem; box-shadow: 0 6px 20px rgba(139,92,246,0.4); }
        .btn-inscrever:hover:not(.disabled) { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(139,92,246,0.4); }
        .btn-inscrever.disabled { opacity: 0.6; cursor: not-allowed; background: #4a5568; box-shadow: none; }
        .skeleton { background: linear-gradient(90deg, #233554 25%, #1a1a2e 50%, #233554 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* Modal styles unchanged */
        .modal-overlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100vh; 
            background: rgba(2,12,27,0.98); 
            z-index: 9999; 
            backdrop-filter: blur(12px); 
            overflow: hidden;
        }
        .modal { 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%) scale(1); 
            background: linear-gradient(145deg, #112240, #0a192f); 
            padding: clamp(1rem, 2.5vw, 1.25rem); 
            border-radius: clamp(12px, 3vw, 18px); 
            border: 1px solid rgba(139,92,246,0.3); 
            box-shadow: 0 20px 60px rgba(0,0,0,0.6); 
            max-width: 97vw; width: clamp(300px, 94vw, 420px); max-height: 90vh; 
            overflow-y: auto; overflow-x: hidden; 
            box-sizing: border-box;
        }
        @media (max-width: 480px) {
            .modal { 
                max-width: 98.5vw; width: 97vw; padding: 0.95rem; 
                max-height: 94vh; 
                margin: 0.25rem; 
                border-radius: 14px; 
            }
            .form-group input { font-size: 16px; padding: 0.8rem 1rem; border-radius: 10px; }
        }
        .modal h3 { color: #8b5cf6; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; color: #64ffda; margin-bottom: 0.5rem; }
        .form-group input { width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.05); border: 1px solid #233554; border-radius: 8px; color: white; }
        .modal-buttons { display: flex; gap: 1rem; justify-content: flex-end; }
        .btn-primary { background: #8b5cf6; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; cursor: pointer; }
        .btn-secondary { background: transparent; color: #64ffda; border: 1px solid #64ffda; }

        /* Back arrow styles */
        .logo-back-container {
            display: flex;
            align-items: center;
        }
        .back-arrow {
            margin-right: 0.75rem;
            font-size: 1.2rem;
            color: var(--neon-blue);
            transition: all 0.3s ease;
        }
        .logo:hover .back-arrow {
            transform: scale(1.1);
            text-shadow: 0 0 10px var(--neon-blue);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <div class="logo-back-container">
                <a href="index.html" class="logo" title="Voltar ao site principal">
                    <i class="fas fa-arrow-left back-arrow" aria-hidden="true"></i>
                    <img src="logoEagle.png" alt="Eagle Event - Voltar">
                </a>
            </div>
<ul class="nav-links">
            </ul>
            <!-- Menu toggle hidden - empty nav -->
        </div>
    </nav>

<section class="hero minicursos-hero" style="background: linear-gradient(rgba(10,25,47,0.85), rgba(2,12,27,0.9)), url('imagem_6.jpeg') center/cover;">
        <div class="container hero-content">
16 Minicursos • 20 Vagas Cada
            <div class="hero-stats" data-aos="fade-up" data-aos-delay="100">
                <div class="stat-item">
data-target="16"
                    <span class="stat-label">Cursos Disponíveis</span>
                </div>
                <div class="stat-item">
data-target="320"
                    <span class="stat-label">Vagas Totais</span>
                </div>
            </div>
            <h1 data-aos="fade-down" data-aos-duration="1000">Masterclasses com Experts</h1>
            <p data-aos="fade-up" data-aos-delay="200">Workshops práticos liderados por profissionais do mercado. Aprendizado hands-on em IA, Cloud, DevOps e mais.</p>
            <button class="btn-cta" data-aos="zoom-in" data-aos-delay="400" onclick="loadMinicursos()"><i class="fas fa-search"></i> Explorar Cursos</button>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div id="minicursos-grid" class="minicursos-grid" data-aos="fade-up">
                <!-- Skeleton loaders -->
                <div class="minicurso-card skeleton" style="height: 300px;"></div>
                <div class="minicurso-card skeleton" style="height: 300px;"></div>
                <div class="minicurso-card skeleton" style="height: 300px;"></div>
                <div class="minicurso-card skeleton" style="height: 300px;"></div>
            </div>
        </div>
    </section>

    <!-- Modal unchanged -->
    <div id="inscricaoModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <i class="fas fa-clipboard-list"></i>
                <h3 id="modalTitle">Inscrever-se</h3>
            </div>
            <form id="inscricaoForm">
                <input type="hidden" id="modalMinicursoId">
                <div class="form-group">
                    <label>Nome Completo *</label>
                    <input type="text" id="modalNome" required maxlength="100">
                </div>
                <div class="form-group">
                    <label>Curso *</label>
                    <input type="text" id="modalCurso" required maxlength="100">
                </div>
                <div class="form-group">
                    <label>Semestre/Turma *</label>
                    <input type="text" id="modalSemestre" required maxlength="50">
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Confirmar Inscrição</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts unchanged -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="minicursos.js"></script>
    <script src="minicursos-stats.js"></script>
    <script>
        AOS.init({ duration: 800 });

        let minicursosData = [];
        let pollInterval;

        async function loadMinicursos() {
            try {
                const res = await fetch('/api/minicursos');
                if (!res.ok) return;
                const response = await res.json();
                minicursosData = response.data || [];
                renderMinicursos();
            } catch (err) {
                console.error('Erro load:', err);
            }
        }

        function renderMinicursos() {
            // Sort by date: Segunda → Terça → Quarta → Quinta
            const dateOrder = {'Segunda':1, 'Terça':2, 'Quarta':3, 'Quinta':4};
            minicursosData.sort((a, b) => dateOrder[a.data] - dateOrder[b.data]);
            
            const grid = document.getElementById('minicursos-grid');
            grid.innerHTML = '';
            minicursosData.forEach(mc => {
                const card = document.createElement('div');
                card.className = 'standard-card minicurso-card';
                card.innerHTML = `
                    <div class="card-header">
                        <h3 class="card-title">${mc.nome}</h3>
                        <div class="card-ministrante"><i class="fas fa-user-tie"></i> ${mc.ministrante}</div>
                        <div class="card-meta">
                            <span class="highlight data-highlight" title="${mc.data}"><i class="fas fa-calendar-alt"></i> ${mc.data}</span>
                            <span class="highlight horario-highlight" title="${mc.horario}"><i class="fas fa-clock"></i> ${mc.horario}</span>
                            <span class="highlight local-highlight" title="${mc.local || 'TBA'}"><i class="fas fa-map-marker-alt"></i> ${mc.local || 'TBA'}</span>
                        </div>
                    </div>
                    <div class="card-details">
                        <div class="vagas-info ${mc.vagas_restantes <= 0 ? 'full' : ''}">
                            <div class="vagas-count">${mc.inscritos}/${mc.vagas_maximas}</div>
                            <div class="vagas-progress"><div class="vagas-progress-fill" style="width: ${ (mc.inscritos / mc.vagas_maximas * 100).toFixed(0) }%;"></div></div>
                            <div class="vagas-remaining">${mc.vagas_restantes > 0 ? `${mc.vagas_restantes} vagas` : 'ESGOTADO'}</div>
                        </div>
                        ${mc.descricao ? `
                            <div class="card-descricao"${mc.descricao.length > 150 ? ` title="${mc.descricao.replace(/"/g, '"')}"` : ''}>
                                ${mc.descricao.substring(0, 150)}${mc.descricao.length > 150 ? '...' : ''}
                            </div>
                            ${mc.material ? `<div class="card-material"><i class="fas fa-cogs"></i> ${mc.material}</div>` : ''}
                        ` : ''}
                        <div class="btn-container">
                            <button class="btn-inscrever ${mc.vagas_restantes <= 0 ? 'disabled' : ''}" 
                                    onclick="openModal(${mc.id})" ${mc.vagas_restantes <= 0 ? 'disabled' : ''}>
                                <i class="fas ${mc.vagas_restantes <= 0 ? 'fa-lock' : 'fa-user-plus'}"></i>
                                ${mc.vagas_restantes <= 0 ? 'ESGOTADO' : 'Inscrever-se'}
                            </button>
                        </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(id) {
            const mc = minicursosData.find(m => m.id === id);
            if (!mc || mc.vagas_restantes <= 0) return;
            document.body.style.overflow = 'hidden';
            document.getElementById('modalMinicursoId').value = id;
            document.getElementById('modalTitle').textContent = `Inscrever - ${mc.nome}`;
            const modal = document.getElementById('inscricaoModal');
            modal.querySelector('.modal').scrollTop = 0;
            modal.style.display = 'block';
            setTimeout(() => modal.querySelector('.modal').focus(), 100);
        }

        function closeModal() {
            const modal = document.getElementById('inscricaoModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('inscricaoForm').reset();
            document.activeElement.blur();
        }

        document.getElementById('inscricaoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = {
                minicurso_id: parseInt(document.getElementById('modalMinicursoId').value),
                nome: document.getElementById('modalNome').value.trim(),
                curso: document.getElementById('modalCurso').value.trim(),
                semestre: document.getElementById('modalSemestre').value.trim()
            };

            try {
                const res = await fetch('/api/inscricoes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                const result = await res.json();

                if (res.ok) {
                    Swal.fire('Sucesso!', result.message, 'success');
                    closeModal();
                    loadMinicursos();
                } else {
                    Swal.fire('Erro', result.error, 'error');
                }
            } catch (err) {
                Swal.fire('Erro', 'Falha na conexão.', 'error');
            }
        });

        function startPolling() {
            loadMinicursos();
            pollInterval = setInterval(loadMinicursos, 10000);
        }

        document.getElementById('mobile-menu')?.addEventListener('click', function() {
            this.classList.toggle('active');
            document.querySelector('.nav-links').classList.toggle('active');
        });

        document.getElementById('inscricaoModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        startPolling();
    </script>
</body>
</html>
